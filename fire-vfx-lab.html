<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Fire VFX Lab</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050507;color:#fff;font-family:system-ui,sans-serif}
#ui{position:fixed;z-index:2;left:18px;top:18px;width:360px;padding:16px;border:1px solid #ffffff20;border-radius:16px;background:#090a0ee8;backdrop-filter:blur(12px)}
h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:#9ca3b4;margin-bottom:12px}
#levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}button{border:1px solid #ffffff18;background:#14151c;color:#e5e7ef;border-radius:9px;padding:9px 4px;font-weight:800;cursor:pointer}button.active{background:#34200c;border-color:#ff9b2f;color:#ffd69e}
#readout{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff12;font-size:12px;color:#b4bac8;line-height:1.5}
#hint{position:fixed;right:18px;bottom:18px;color:#7f8798;font-size:11px;background:#08090de0;padding:8px 11px;border-radius:9px}
</style>
</head>
<body>
<div id="ui"><h1>THREE.JS FIRE VFX LAB</h1><div class="sub">10 escalating attack tiers — procedural particles + bloom + shockwaves</div><div id="levels"></div><div id="readout"></div></div>
<div id="hint">SPACE = next • A = auto-demo</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {EffectComposer} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/EffectComposer.js";
import {RenderPass} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/UnrealBloomPass.js";

const T=[
["Spark",120,.45,1.4,1.2,.55],["Flare",190,.62,1.8,1.7,.7],["Burst",260,.78,2.2,2.1,.9],["Bolt",340,.9,2.8,2.7,1],
["Blast",460,1.05,3.2,3.2,1.3],["Inferno",600,1.25,3.7,3.8,1.55],["Meteor",760,1.45,4.2,4.5,1.8],
["Dragon",950,1.7,4.7,5.2,2],["Sunburst",1250,2,5.2,6.1,2.4],["CATACLYSM",1700,2.45,6,7.2,3]
];
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050507,.035);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,120);camera.position.set(0,2.1,15);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.35,.55,.72);composer.addPass(bloom);
scene.add(new THREE.AmbientLight(0x24160a,1.3));
const floor=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshBasicMaterial({color:0x0b0b0e,transparent:true,opacity:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.05;scene.add(floor);
const root=new THREE.Group();scene.add(root);let points,core,rings=[],vel,age,life,seed,level=0,timer=0,auto=false;
const buttons=document.getElementById("levels");for(let i=0;i<10;i++){let b=document.createElement("button");b.textContent=i+1;b.onclick=()=>{auto=false;build(i)};buttons.appendChild(b)}
function glowMat(c,o=1){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}
function build(i){
 level=i;timer=0;root.clear();rings=[];const [name,count,size,speed,height,width]=T[i];
 vel=new Float32Array(count*3);age=new Float32Array(count);life=new Float32Array(count);seed=new Float32Array(count*3);const pos=new Float32Array(count*3);
 for(let p=0;p<count;p++){respawn(p,pos,size,speed,width)}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));
 points=new THREE.Points(g,new THREE.PointsMaterial({color:0xff8a16,size:size*.115,transparent:true,opacity:.96,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));root.add(points);
 core=new THREE.Mesh(new THREE.SphereGeometry(size*.5,32,32),glowMat(0xff5a08,.9));root.add(core);
 const inner=new THREE.Mesh(new THREE.SphereGeometry(size*.22,24,24),glowMat(0xfff2a0,1));core.add(inner);
 for(let r=0;r<Math.min(6,1+Math.floor(i/2));r++){let m=new THREE.Mesh(new THREE.RingGeometry(size*(.7+r*.5),size*(.76+r*.5),64),glowMat(0xff7b12,.55));m.rotation.x=-Math.PI/2;m.position.y=-.92+r*.12;m.userData.phase=r*.55;rings.push(m);root.add(m)}
 document.querySelectorAll("#levels button").forEach((b,k)=>b.classList.toggle("active",k===i));
 document.getElementById("readout").innerHTML="<b>LEVEL "+(i+1)+"/10 — "+name+"</b><br>"+count.toLocaleString()+" particles • velocity "+speed.toFixed(1)+" • footprint "+width.toFixed(1)+"<br>"+(["tiny ignition","quick burst","combat fireball","focused flame lance","heavy explosion","area inferno","falling fire mass","serpentine flame wave","screen-filling detonation","boss-scale ultimate"][i]);
}
function respawn(p,pos,size,speed,width){let j=p*3,a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.55)*width;pos[j]=Math.cos(a)*r;pos[j+1]=-.8+Math.random()*.18;pos[j+2]=Math.sin(a)*r*.5;vel[j]=(Math.random()-.5)*speed*.42;vel[j+1]=speed*(.35+Math.random()*.9);vel[j+2]=(Math.random()-.5)*speed*.3;life[p]=.35+Math.random()*(1.1+level*.05);age[p]=Math.random()*life[p];seed[j]=Math.random()*20;seed[j+1]=Math.random()*20;seed[j+2]=Math.random()*20}
build(0);const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.033);timer+=dt;if(auto&&timer>1.8){build((level+1)%10);timer=0}
 if(points){const a=points.geometry.attributes.position.array,[name,count,size,speed,height,width]=T[level];for(let p=0;p<count;p++){let j=p*3;age[p]+=dt;if(age[p]>life[p]){respawn(p,a,size,speed,width);continue}let drag=Math.max(.8,1-dt*(1.2+level*.18));vel[j]*=drag;vel[j+2]*=drag;a[j]+=vel[j]*dt;a[j+1]+=vel[j+1]*dt;a[j+2]+=vel[j+2]*dt;let f=age[p]/life[p];a[j]+=Math.sin(timer*5+seed[j])*dt*(.18+level*.025);a[j+2]+=Math.cos(timer*4+seed[j+2])*dt*(.15+level*.02);a[j+1]+=dt*(.5+level*.06)*(1-f)}
 points.geometry.attributes.position.needsUpdate=true;points.material.size=size*(.085+.02*Math.sin(timer*7))}
 if(core){let p=1+.15*Math.sin(timer*12)+.07*Math.sin(timer*23);core.scale.setScalar(p);core.rotation.y+=dt*(1+level*.18)}
 rings.forEach((r,k)=>{let p=(timer*1.45+r.userData.phase)%1;r.scale.setScalar(1+p*(1.8+level*.13));r.material.opacity=(1-p)*(.5+level*.025);r.rotation.z+=dt*(k%2?-.8:.8)});
 root.rotation.y=Math.sin(timer*.35)*.18;root.position.y=Math.sin(timer*1.6)*.08;bloom.strength=1.05+level*.115+Math.sin(timer*7)*.05;composer.render()}
tick();
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();auto=false;build((level+1)%10)}if(e.key.toLowerCase()==="a"){auto=!auto;timer=0}});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
